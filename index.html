
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Diagnostic error handler
        window.addEventListener('error', function(event) {
            const display = document.getElementById('error-display');
            if (display) {
                display.style.display = 'block';
                display.textContent = 'System Error: ' + (event.error ? event.error.message : event.message) + '\n\nNote: GitHub Pages might block .tsx files if not transpiled. Check your build process.';
            }
        });
        window.addEventListener('unhandledrejection', function(event) {
            const display = document.getElementById('error-display');
            if (display) {
                display.style.display = 'block';
                display.textContent = 'Promise Rejection: ' + event.reason + '\n\nThis usually happens if a module fails to load from the server.';
            }
        });
    </script>
</head>
<body>
    <div id="error-display"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
