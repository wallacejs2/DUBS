
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#1e293b',
                950: '#020617',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
            font-size: 14px;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Custom scrollbar — WebKit */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        .dark ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c7c7cc;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #48484a;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #636366;
        }
        /* Firefox scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: #c7c7cc transparent;
        }
        .dark * {
            scrollbar-color: #48484a transparent;
        }
        /* Loading state */
        #root:empty::before {
            content: 'Loading Curator...';
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #8e8e93;
            font-weight: 500;
            font-size: 15px;
            background: #F2F2F7;
            letter-spacing: -0.01em;
        }
        html.dark #root:empty::before {
            background: #000000;
            color: #8e8e93;
        }
        /* iOS shimmer loading animation */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .ios-shimmer {
            background: linear-gradient(90deg, #e5e5ea 25%, #f2f2f7 50%, #e5e5ea 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        .dark .ios-shimmer {
            background: linear-gradient(90deg, #2c2c2e 25%, #3a3a3c 50%, #2c2c2e 75%);
            background-size: 200% 100%;
        }
        /* Error Display */
        #error-display {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: #fef2f2;
            border: 1px solid #fee2e2;
            padding: 16px;
            border-radius: 16px;
            color: #991b1b;
            z-index: 9999;
            font-family: monospace;
            white-space: pre-wrap;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
    <script>
        // Diagnostic error handler
        window.addEventListener('error', function(event) {
            const display = document.getElementById('error-display');
            if (display) {
                display.style.display = 'block';
                display.textContent = 'System Error: ' + (event.error ? event.error.message : event.message) + '\n\nNote: GitHub Pages might block .tsx files if not transpiled. Check your build process.';
            }
        });
        window.addEventListener('unhandledrejection', function(event) {
            const display = document.getElementById('error-display');
            if (display) {
                display.style.display = 'block';
                display.textContent = 'Promise Rejection: ' + event.reason + '\n\nThis usually happens if a module fails to load from the server.';
            }
        });
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.475.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="error-display"></div>
    <div id="root"></div>
    <script type="module">
        // Ensure index.tsx is loaded relative to the current path
        import "./index.tsx";
    </script>
</body>
</html>
